# Render.com blueprint — fill service id and env group in week 4.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: lumen-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn lumen.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # - key: OPENAI_API_KEY
      #   sync: false
