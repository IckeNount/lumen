# Lumen evaluation set — grow to 20+ items in week 3.
# Categories: factual, contested (contradictory sources expected), no_good_source.

version: "0.1.0"

questions:
  - id: "fact_capital_france"
    category: "factual"
    question: "What is the capital of France?"
    must_cite: true

  - id: "contested_nutrition"
    category: "contested"
    question: "Does moderate coffee consumption increase longevity? Summarize conflicting evidence."
    expect_contradictions: true

  - id: "thin_evidence_obscure"
    category: "thin_evidence"
    question: "What was the exact population of the village of Xylophonia in 1732?"
    expect_uncertainty: true
